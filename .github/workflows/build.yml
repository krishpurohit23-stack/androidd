name: Build IPA

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Find newest App.swift
        run: |
          mkdir -p Sources
          BEST=0
          F=""
          while IFS= read -r f; do
            n=$(grep -o "ANDROID_LITE_BUILD=[0-9]*" "$f" | head -1 | cut -d= -f2)
            if [ -n "$n" ] && [ "$n" -gt "$BEST" ]; then BEST=$n; F="$f"; fi
          done < <(find . -iname "*.swift" -not -path "./Sources/*" -not -path "./.git/*")
          if [ -z "$F" ]; then
            echo "ERROR: no Swift file with the ANDROID_LITE_BUILD marker found."
            echo "Your repo still has an OLD App.swift. Swift files present:"
            find . -iname "*.swift" -not -path "./.git/*"
            exit 1
          fi
          echo "Building Android Lite build $BEST from $F"
          cp "$F" Sources/App.swift

      - name: Generate Xcode project
        run: |
          cat > project.yml << 'EOF'
          name: AndroidLite
          options:
            bundleIdPrefix: com.androidlite
          targets:
            AndroidLite:
              type: application
              platform: iOS
              deploymentTarget: "16.0"
              sources:
                - Sources
              settings:
                base:
                  PRODUCT_BUNDLE_IDENTIFIER: com.androidlite.app
                  PRODUCT_NAME: AndroidLite
                  GENERATE_INFOPLIST_FILE: YES
                  INFOPLIST_KEY_CFBundleDisplayName: Android Lite
                  INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
                  INFOPLIST_KEY_UILaunchScreen_Generation: YES
                  INFOPLIST_KEY_UIStatusBarHidden: YES
                  INFOPLIST_KEY_NSCameraUsageDescription: Android Lite camera app needs the camera to take photos.
                  INFOPLIST_KEY_NSPhotoLibraryAddUsageDescription: Android Lite saves your photos to your Photos library.
                  INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
                  MARKETING_VERSION: "1.0"
                  CURRENT_PROJECT_VERSION: "1"
                  SWIFT_VERSION: "5.0"
                  TARGETED_DEVICE_FAMILY: "1"
          EOF
          xcodegen generate

      - name: Build (unsigned)
        run: |
          xcodebuild -project AndroidLite.xcodeproj \
            -scheme AndroidLite \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Package IPA
        run: |
          mkdir Payload
          cp -R build/Build/Products/Release-iphoneos/AndroidLite.app Payload/
          zip -r AndroidLite.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: AndroidLite-ipa
          path: AndroidLite.ipa
